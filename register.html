<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registrati · Boletus Map</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Outfit,system-ui,sans-serif;color:#f3e6d4;
  background:#1a1008 url('/static/bosco.jpg') center/cover fixed;display:flex;align-items:center;justify-content:center}
.veil{position:fixed;inset:0;background:linear-gradient(160deg,rgba(26,16,8,.75),rgba(42,26,16,.88));}
.box{position:relative;z-index:1;width:min(400px,94vw);padding:28px 26px;border-radius:20px;
  background:rgba(42,26,16,.82);border:1px solid rgba(196,120,58,.35);backdrop-filter:blur(16px);
  box-shadow:0 20px 50px rgba(0,0,0,.4)}
img{width:72px;height:72px;border-radius:50%;border:2px solid #c4783a;object-fit:cover;display:block;margin:0 auto 10px}
h1{font-family:"Cormorant Garamond",Georgia,serif;text-align:center;margin:0 0 4px;font-size:2rem}
p{text-align:center;opacity:.8;font-size:.85rem;margin:0 0 18px}
label{display:block;font-size:.75rem;margin:10px 0 4px;color:#c4783a;letter-spacing:.06em;text-transform:uppercase}
input{width:100%;padding:12px;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid rgba(196,120,58,.3);
  background:rgba(20,10,4,.5);color:#f3e6d4;font-family:inherit;font-size:.95rem}
input:focus{outline:none;border-color:#c4783a}
button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;cursor:pointer;
  font-family:inherit;font-weight:600;font-size:1rem;color:#1a1008;
  background:linear-gradient(135deg,#c4783a,#a65d2e);box-shadow:0 6px 20px rgba(139,74,31,.4)}
.err{color:#e07050;font-size:.85rem;text-align:center;margin-top:10px}

.btn-secondario{
  width:100%;margin-top:0;padding:12px;border-radius:12px;cursor:pointer;
  font-family:inherit;font-weight:600;font-size:.95rem;
  color:#f3e6d4;background:transparent;border:1px solid rgba(196,120,58,.55)
}
.btn-secondario:hover{background:rgba(196,120,58,.15)}
.ok{color:#8fbc6a;font-size:.85rem;text-align:center;margin-top:10px}

.donate-box{margin-top:14px;padding:12px;border-radius:12px;border:1px solid rgba(196,120,58,.35);background:rgba(0,0,0,.2)}
.donate-tit{margin:0 0 6px;font-weight:600;color:#c4783a;font-size:.9rem}
.donate-txt{margin:0 0 10px;font-size:.78rem;line-height:1.45;opacity:.9;text-align:left}
.btn-paypal{display:block;text-align:center;margin:8px 0 12px;padding:12px;border-radius:12px;
  background:linear-gradient(135deg,#0070ba,#003087);color:#fff!important;font-weight:600;text-decoration:none}
.chk{display:flex!important;align-items:center;gap:8px;text-transform:none!important;letter-spacing:0!important;
  font-size:.8rem!important;color:#f3e6d4!important;margin:8px 0!important;cursor:pointer}
.chk input{width:auto;margin:0}


a{color:#c4783a;text-decoration:none}
.foot{text-align:center;margin-top:16px;font-size:.85rem;opacity:.85}

@media(max-width:480px){
  body{align-items:flex-end;padding:0}
  .box{width:100%;min-height:auto;border-radius:20px 20px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom))}
  button{min-height:48px}
}
</style>
</head>
<body>
<div class="veil"></div>
<div class="box">
  <img src="/static/logo.png" alt="logo">
  <h1>Unisciti</h1>
  <p>Crea il tuo accesso da cercatore</p>
  <form method="post" action="/register" id="form-registra">
    <label>Email</label>
    <input type="email" name="email" id="email" required autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" required autocomplete="new-password">
    <label>Conferma password</label>
    <input type="password" name="password2" required autocomplete="new-password">
    <label>Codice invito</label>
    <input type="text" name="codice" id="codice" required autocomplete="off" placeholder="Codice fornito dall'admin">
    <button type="submit" name="azione" value="registra">Registrati</button>
  </form>
  <div class="donate-box">
    <p class="donate-tit">Accesso con donazione (min. 10 €)</p>
    <p class="donate-txt">1) Dona almeno <b>10 €</b> via PayPal<br>
    2) Torna qui, conferma e richiedi il codice<br>
    3) Riceverai il <b>codice monouso</b> via email dopo la verifica</p>
    <a class="btn-paypal" href="{{ paypal_url }}" target="_blank" rel="noopener">Dona 10 € con PayPal</a>
    <label class="chk"><input type="checkbox" id="donato"> Ho donato almeno 10 € a davidemenna3@gmail.com</label>
    <label>ID transazione PayPal (facoltativo)</label>
    <input type="text" id="tx_id" placeholder="es. codice pagamento" autocomplete="off">
    <button type="button" class="btn-secondario" id="btn-richiedi">Richiedi codice invito</button>
  </div>
  <div id="msg-richiesta" class="ok" style="display:none"></div>
  <script>
  (function(){
    var btn = document.getElementById('btn-richiedi');
    var msg = document.getElementById('msg-richiesta');
    if(!btn) return;
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      var email = (document.getElementById('email') || {}).value || '';
      email = String(email).trim();
      var donato = document.getElementById('donato');
      var tx = (document.getElementById('tx_id') || {}).value || '';
      if(!email || email.indexOf('@') < 0){
        msg.style.display = 'block'; msg.className = 'err';
        msg.textContent = 'Inserisci prima la tua email';
        return;
      }
      if(!donato || !donato.checked){
        msg.style.display = 'block'; msg.className = 'err';
        msg.textContent = 'Conferma di aver donato almeno 10 € via PayPal';
        return;
      }
      btn.disabled = true;
      msg.style.display = 'block'; msg.className = 'ok';
      msg.textContent = 'Invio richiesta…';
      var fd = new FormData();
      fd.append('email', email);
      fd.append('donato', '1');
      fd.append('tx_id', tx);
      fetch('/register/richiedi-codice', { method:'POST', body: fd, credentials:'same-origin' })
        .then(function(r){ return r.json().catch(function(){ return {ok:false, errore:'Risposta non valida'}; }); })
        .then(function(data){
          if(data && data.ok){
            msg.className = 'ok';
            msg.textContent = data.messaggio || 'Richiesta inviata.';
          } else {
            msg.className = 'err';
            msg.textContent = (data && data.errore) || 'Errore';
          }
        })
        .catch(function(){ msg.className = 'err'; msg.textContent = 'Errore di rete'; })
        .finally(function(){ btn.disabled = false; });
    });
  })();
  </script>
</div>
</body>
</html>
